<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tamim | Portfolio</title>

  <style>
    :root{
      --bg: #263526;
      --bg2:#2f3e2f;
      --card: rgba(255,255,255,0.06);
      --card2: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.12);
      --text: #f2f2ec;
      --muted: rgba(242,242,236,0.78);
      --gold: #c9b458;
      --shadow: 0 14px 40px rgba(0,0,0,0.35);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(1200px 600px at 15% 10%, var(--bg2), var(--bg));
      color: var(--text);
      line-height: 1.65;
    }

    a { color: var(--text); text-decoration: none; }
    a:hover { color: var(--gold); }

    .container{
      width: min(1100px, 92vw);
      margin: 0 auto;
      padding: 22px 0 70px;
    }

    .nav{
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(10px);
      background: rgba(38,53,38,0.60);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner{
      width: min(1100px, 92vw);
      margin: 0 auto;
      display:flex;
      align-items:center;
      justify-content: space-between;
      padding: 12px 0;
      gap: 14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .dot{
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 4px rgba(201,180,88,0.12);
    }

    .nav-links{
      display:flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav-links a{
      font-size: 14px;
      opacity: 0.9;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid transparent;
    }

    .nav-links a:hover{
      border-color: rgba(201,180,88,0.45);
      background: rgba(201,180,88,0.08);
    }

    .hero{
      margin-top: 18px;
      display:grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 18px;
      align-items: stretch;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero-main{
      padding: 22px;
      position: relative;
      overflow: hidden;
    }

    .hero-main:before{
      content:"";
      position:absolute;
      inset:-80px -80px auto auto;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle at 30% 30%, rgba(201,180,88,0.22), transparent 60%);
      transform: rotate(12deg);
      pointer-events:none;
    }

    .kicker{
      display:inline-flex;
      gap: 10px;
      align-items:center;
      padding: 6px 10px;
      border: 1px solid rgba(201,180,88,0.35);
      background: rgba(201,180,88,0.10);
      border-radius: 999px;
      font-size: 13px;
      color: var(--text);
      opacity: 0.95;
    }

    .kicker span {
      color: var(--gold);
      font-weight: 700;
    }

    h1{
      margin: 14px 0 8px;
      font-size: clamp(28px, 4vw, 40px);
      letter-spacing: 0.2px;
      line-height: 1.15;
    }

    .subtitle{
      margin: 0 0 14px;
      color: var(--muted);
      max-width: 60ch;
      font-size: 15px;
    }

    .buttons{
      display:flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid rgba(201,180,88,0.55);
      background: rgba(201,180,88,0.12);
      color: var(--text);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.2px;
      transition: transform .12s ease, background .12s ease;
    }

    .btn:hover{
      background: rgba(201,180,88,0.18);
      transform: translateY(-1px);
      color: var(--text);
    }

    .btn.secondary{
      border-color: rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.06);
      font-weight: 600;
    }

    .btn.secondary:hover{
      background: rgba(255,255,255,0.10);
      color: var(--gold);
    }

    .hero-side{
      padding: 18px;
      display:flex;
      flex-direction: column;
      gap: 12px;
    }

    .profile{
      display:flex;
      gap: 14px;
      align-items:center;
      padding: 14px;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .avatar{
      width: 86px;
      height: 86px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(201,180,88,0.7);
      background: rgba(0,0,0,0.2);
      flex: 0 0 auto;
    }

    .profile h2{
      margin: 0;
      font-size: 16px;
    }

    .profile p{
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .quick{
      padding: 14px;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .quick-title{
      margin: 0 0 10px;
      font-size: 14px;
      color: var(--gold);
      letter-spacing: 0.2px;
    }

    .quick-grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 8px;
      font-size: 14px;
      color: var(--muted);
    }

    .quick-grid strong{
      color: var(--text);
      font-weight: 700;
    }

    section{
      margin-top: 18px;
    }

    .section-card{
      padding: 20px;
    }

    .section-title{
      margin: 0 0 10px;
      font-size: 18px;
      color: var(--gold);
      letter-spacing: 0.2px;
    }

    .section-text{
      margin: 0;
      color: var(--muted);
    }

    .grid-2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 12px;
    }

    .grid-3{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 12px;
    }

    .mini{
      padding: 14px;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .mini h3{
      margin: 0 0 6px;
      font-size: 15px;
      color: var(--text);
    }

    .mini p{
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }

    .pills{
      display:flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .pill{
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      font-size: 13px;
      color: var(--text);
      opacity: 0.95;
    }

    .pill.gold{
      border-color: rgba(201,180,88,0.45);
      background: rgba(201,180,88,0.10);
    }

    .
